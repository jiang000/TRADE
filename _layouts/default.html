<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.pubdate %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      --bg: #f7f5f0;
      --card: #ffffff;
      --ink: #2a2a28;
      --muted: #8a857c;
      --accent: #b5452f;
      --accent-soft: #f3e4df;
      --border: #e7e2d8;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(40, 35, 25, .04), 0 4px 14px rgba(40, 35, 25, .06);
      --shadow-hover: 0 6px 24px rgba(40, 35, 25, .12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    .site-header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .site-header .wrap {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 18px 24px;
      max-width: 1160px;
      margin: 0 auto;
    }
    .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .5px;
    }
    .brand:hover { color: var(--accent); }
    .tagline {
      color: var(--muted);
      font-size: 13px;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }

    .intro { margin-bottom: 28px; }
    .page-title { font-size: 30px; font-weight: 700; letter-spacing: .5px; }
    .page-sub { color: var(--muted); font-size: 14px; margin-top: 6px; }

    /* ============ 瀑布流 ============ */
    .waterfall {
      column-count: 3;
      column-gap: 18px;
    }
    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      break-inside: avoid;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent-soft);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.55;
      color: var(--ink);
    }
    .card:hover .card-title { color: var(--accent); }
    .card-meta {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--muted);
    }
    .card-meta .author {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 1px 9px;
      border-radius: 999px;
      font-weight: 500;
    }

    /* ============ 文章页 ============ */
    .breadcrumb { margin-bottom: 20px; font-size: 14px; color: var(--muted); }
    .breadcrumb a:hover { color: var(--accent); }

    .post { max-width: 760px; margin: 0 auto; background: transparent; }
    .post-title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: .3px;
      margin-bottom: 16px;
    }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 14px;
      color: var(--muted);
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .post-meta .author {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 12px;
      border-radius: 999px;
      font-weight: 500;
    }

    .post-content {
      font-size: 16.5px;
      line-height: 1.85;
      color: #33322f;
    }
    .post-content h1, .post-content h2, .post-content h3, .post-content h4 {
      color: var(--ink);
      font-weight: 700;
      line-height: 1.4;
      margin: 1.6em 0 .6em;
    }
    .post-content h1 { font-size: 24px; }
    .post-content h2 { font-size: 21px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .post-content h3 { font-size: 18px; }
    .post-content p { margin: .9em 0; }
    .post-content a { color: var(--accent); border-bottom: 1px solid var(--accent-soft); }
    .post-content a:hover { border-bottom-color: var(--accent); }
    .post-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 12px 0;
      box-shadow: var(--shadow);
    }
    .post-content blockquote {
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      padding: 10px 16px;
      margin: 1.2em 0;
      border-radius: 0 8px 8px 0;
      color: #5a5248;
    }
    .post-content blockquote p { margin: .4em 0; }
    .post-content code {
      background: #efece4;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: .9em;
      font-family: "SF Mono", Consolas, "Courier New", monospace;
    }
    .post-content pre {
      background: #2a2a28;
      color: #f0ece2;
      padding: 16px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 1.2em 0;
    }
    .post-content pre code { background: none; color: inherit; padding: 0; }
    .post-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2em 0;
      font-size: 15px;
    }
    .post-content th, .post-content td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    .post-content th { background: #f1ede4; font-weight: 600; }
    .post-content ul, .post-content ol { padding-left: 1.4em; margin: .8em 0; }
    .post-content li { margin: .3em 0; }
    .post-content hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

    .site-footer {
      border-top: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 22px 24px;
    }
    .site-footer a { color: var(--accent); }

    /* ============ 响应式 ============ */
    @media (max-width: 900px) {
      .waterfall { column-count: 2; }
    }
    @media (max-width: 560px) {
      .waterfall { column-count: 1; }
      .site-header .wrap { padding: 14px 18px; }
      main { padding: 24px 18px 40px; }
      .post-title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="tagline">{{ site.description }}</span>
    </div>
  </header>

  <main>
    {% if page.pubdate %}
    <article class="post">
      <nav class="breadcrumb"><a href="{{ '/' | relative_url }}">← 返回首页</a></nav>
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="post-meta">
        {% if page.author %}<span class="author">{{ page.author }}</span>{% endif %}
        <span class="date">{{ page.pubdate }}</span>
      </div>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
    {% else %}
      {{ content }}
    {% endif %}
  </main>

  <footer class="site-footer">
    <p>© {{ site.time | date: '%Y' }} {{ site.title }} · Powered by <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a></p>
  </footer>
</body>
</html>
